name: Generate package-lock

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-lock:
    name: Generate package-lock.json
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true # allows the job to push changes
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate package-lock.json
        shell: bash
        run: |
          set -euo pipefail
          echo "Generating package-lock.json via npm install --package-lock-only"
          npm install --package-lock-only
          echo "package-lock.json generated"

      - name: Commit package-lock.json
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(ci): add package-lock.json generated by workflow"
            git push origin HEAD:$(git rev-parse --abbrev-ref HEAD)
          fi
