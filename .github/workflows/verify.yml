name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify (typecheck & build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        shell: bash
        run: |
          set +e
          npm ci 2>&1 | tee npm-install.log
          echo "${PIPESTATUS[0]}" > npm_exit
          exit 0

      - name: Type check
        shell: bash
        run: |
          set +e
          npx tsc --noEmit 2>&1 | tee tsc.log
          echo "${PIPESTATUS[0]}" > tsc_exit
          exit 0

      - name: Build app
        shell: bash
        run: |
          set +e
          npm run build 2>&1 | tee build.log
          echo "${PIPESTATUS[0]}" > build_exit
          exit 0

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-logs
          path: |
            npm-install.log
            tsc.log
            build.log
            npm_exit
            tsc_exit
            build_exit

      - name: Fail if checks failed
        if: always()
        shell: bash
        run: |
          npm_code=$(cat npm_exit)
          tsc_code=$(cat tsc_exit)
          build_code=$(cat build_exit)
          echo "npm_exit=${npm_code} tsc_exit=${tsc_code} build_exit=${build_code}"

          if [ "${npm_code}" != "0" ]; then
            echo "npm ci failed with exit code ${npm_code}"
            exit ${npm_code}
          fi

          if [ "${tsc_code}" != "0" ]; then
            echo "TypeScript typecheck failed with exit code ${tsc_code}"
            exit ${tsc_code}
          fi

          if [ "${build_code}" != "0" ]; then
            echo "Production build failed with exit code ${build_code}"
            exit ${build_code}
          fi

          echo "npm ci, typecheck, and build succeeded"
